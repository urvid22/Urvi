<body class="index-page">

    <img src="assets/Name (red).png" alt="Urvi Dhomne" class="fullname-image" id="fullnameImage">

    <div class="curtain-container" id="curtainContainer" aria-hidden="true">
        <div class="curtain curtain-top">
            <div class="hey-text">Hey, I'm</div>
            <img src="assets/nametop.png" alt="" class="curtain-name-top">
            <div class="dot-marker" data-dot-index="0" style="left:9%;top:22%"><span class="dot-tag">love art</span></div>
            <div class="dot-marker" data-dot-index="1" style="left:83%;top:18%"><span class="dot-tag">analyses everything</span></div>
            <div class="dot-marker" data-dot-index="2" style="left:13%;top:67%"><span class="dot-tag">photography lover</span></div>
        </div>

        <div class="logo-container">
            <h1 class="logo">URVI</h1>
        </div>

        <div class="curtain curtain-bottom">
            <img src="assets/namebottom.png" alt="" class="curtain-name-bottom">
            <div class="dhomne-text">DHOMNE</div>
            <div class="dot-marker" data-dot-index="3" style="left:79%;top:28%"><span class="dot-tag">exploring cafes</span></div>
            <div class="dot-marker" data-dot-index="4" style="left:86%;top:55%"><span class="dot-tag">running a 5k</span></div>
            <div class="dot-marker" data-dot-index="5" style="left:38%;top:48%"><span class="dot-tag">romanticizing life</span></div>
            <div class="curtain-content">
                <span class="location-prefix location-prefix-left">Originally from</span>
                <div class="location-label location-left">
                    <span class="label-english">Mumbai</span>
                </div>
                <span class="location-prefix location-prefix-right">Currently in</span>
                <div class="location-label location-right">
                    <span class="label-location">Washington DC</span>
                </div>
            </div>
        </div>

        <div class="scroll-indicator">
            <div class="scroll-arrow"></div>
        </div>
    </div>

    <div class="top-left-logo" id="topLeftLogo">
        <a href="index.html">
            <img src="assets/sun red.svg" alt="Urvi" class="index-logo index-logo-red">
            <img src="assets/sun beige.svg" alt="Urvi" class="index-logo index-logo-beige">
        </a>
    </div>

    <img src="assets/mainposter.png" alt="" class="main-poster" id="mainPoster">


    <main class="main-content">

        <section id="landing" class="landing-section">
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function typeText(el, text, speed, callback) {
                el.textContent = '';
                var i = 0;
                function tick() {
                    el.textContent = text.slice(0, ++i);
                    if (i < text.length) setTimeout(tick, speed);
                    else if (callback) setTimeout(callback, 150);
                }
                tick();
            }

            var prefixLeft    = document.querySelector('.location-prefix-left');
            var prefixRight   = document.querySelector('.location-prefix-right');
            var labelEnglish  = document.querySelector('.label-english');
            var labelLocation = document.querySelector('.label-location');

            if (prefixLeft)    prefixLeft.textContent    = '';
            if (prefixRight)   prefixRight.textContent   = '';
            if (labelEnglish)  labelEnglish.textContent  = '';
            if (labelLocation) labelLocation.textContent = '';

            var delay = 600;

            setTimeout(function () {
                typeText(prefixLeft, 'Originally from', 45, function () {
                    typeText(labelEnglish, 'Mumbai', 90);
                });
            }, delay);

            setTimeout(function () {
                typeText(prefixRight, 'Currently in', 45, function () {
                    typeText(labelLocation, 'Washington DC', 90);
                });
            }, delay + 150);
        });
    </script>

    <script>
    (function () {
        document.addEventListener('DOMContentLoaded', function () {
            var dots = Array.from(document.querySelectorAll('.dot-marker')).sort(function (a, b) {
                return +a.dataset.dotIndex - +b.dataset.dotIndex;
            });
            if (!dots.length) return;

            var current = 0;
            var active = true;
            var timer = null;

            function next() {
                if (!active) return;
                dots.forEach(function (d) { d.classList.remove('dot-active'); });
                dots[current].classList.add('dot-active');
                timer = setTimeout(function () {
                    dots[current].classList.remove('dot-active');
                    current = (current + 1) % dots.length;
                    timer = setTimeout(next, 600);
                }, 3000);
            }

            timer = setTimeout(next, 1400);
        });
    })();
    </script>

    <script src="js/main.js"></script>
    <script src="js/image-loader.js"></script>

</body>
</html>
