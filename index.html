    <!-- Location Label Typewriter -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function typeText(el, text, speed, callback) {
                el.textContent = '';
                var i = 0;
                function tick() {
                    el.textContent = text.slice(0, ++i);
                    if (i < text.length) setTimeout(tick, speed);
                    else if (callback) setTimeout(callback, 150);
                }
                tick();
            }

            var prefixLeft    = document.querySelector('.location-prefix-left');
            var prefixRight   = document.querySelector('.location-prefix-right');
            var labelEnglish  = document.querySelector('.label-english');
            var labelLocation = document.querySelector('.label-location');

            // Clear text so it types in fresh
            if (prefixLeft)    prefixLeft.textContent    = '';
            if (prefixRight)   prefixRight.textContent   = '';
            if (labelEnglish)  labelEnglish.textContent  = '';
            if (labelLocation) labelLocation.textContent = '';

            var delay = 600;

            // Left side: "Originally from" → "Mumbai"
            setTimeout(function () {
                typeText(prefixLeft, 'Originally from', 45, function () {
                    typeText(labelEnglish, 'Mumbai', 90);
                });
            }, delay);

            // Right side: staggered slightly → "Currently in" → "Washington DC"
            setTimeout(function () {
                typeText(prefixRight, 'Currently in', 45, function () {
                    typeText(labelLocation, 'Washington DC', 90);
                });
            }, delay + 150);
        });
    </script>

    <!-- Dot marker cycling -->
    <script>
    (function () {
        document.addEventListener('DOMContentLoaded', function () {
            var dots = Array.from(document.querySelectorAll('.dot-marker')).sort(function (a, b) {
                return +a.dataset.dotIndex - +b.dataset.dotIndex;
            });
            if (!dots.length) return;

            var current = 0;
            var active = true;
            var timer = null;

            function next() {
                if (!active) return;
                dots.forEach(function (d) { d.classList.remove('dot-active'); });
                dots[current].classList.add('dot-active');
                timer = setTimeout(function () {
                    dots[current].classList.remove('dot-active');
                    current = (current + 1) % dots.length;
                    timer = setTimeout(next, 600); // gap between dots
                }, 3000);
            }

            // Start after initial settle
            timer = setTimeout(next, 1400);

            // Stop when curtains finish opening
            var landingButtons = document.getElementById('landingButtons');
            if (landingButtons) {
                new MutationObserver(function (mutations, obs) {
                    if (landingButtons.classList.contains('visible')) {
                        active = false;
                        clearTimeout(timer);
                        dots.forEach(function (d) { d.classList.remove('dot-active'); });
                        obs.disconnect();
                    }
                }).observe(landingButtons, { attributes: true, attributeFilter: ['class'] });
            }
        });
    })();
    </script>
